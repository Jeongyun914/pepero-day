<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배정윤이 빼빼로를 보냈어요 🎁</title>
<meta name="description" content="받기 누르면 뭐가 튀어나올지 몰라요. 아몬드·누드·딸기·화이트·기본 5종 랜덤!">
<meta property="og:type" content="website">
<meta property="og:title" content="배정윤이 빼빼로를 보냈어요 🎁">
<meta property="og:description" content="받기 누르면 뭐가 튀어나올지 몰라요. 5종 랜덤!">
<meta property="og:url" content="https://jeongyun914.github.io/pepero-day/">
<meta property="og:image" content="https://jeongyun914.github.io/pepero-day/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 다크 초콜릿 바탕 위 과자색 티켓 한 장 → 받으면 맛마다 다른 색의 집중선 무대 */
  --choco: #2b150d;
  --choco-2: #4a2717;
  --biscuit: #f0c27b;
  --paper: #fff6e6;
  --berry: #ff4f8b;
  --berry-2: #ff74a4;
  --berry-ink: #c01d5c;
  --font-display: "Bagel Fat One", "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--choco);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255, 79, 139, .2) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 80%, rgba(240, 194, 123, .16) 0 2px, transparent 3px);
  background-size: 46px 46px, 62px 62px;
  color: var(--paper);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--biscuit); outline-offset: 4px; }

/* ---------- 선물 화면 ---------- */
.gift {
  min-height: 100%;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 16px;
  padding: 28px 16px 36px;
}
.eyebrow { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .08em; color: var(--biscuit); }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(30px, 8.4vw, 44px);
  line-height: 1.15;
  text-align: center;
  text-wrap: balance;
}
h1 em { font-style: normal; color: var(--berry); }
.note { margin: 0 0 4px; font-size: 15px; color: rgba(255, 246, 230, .82); text-align: center; }

.ticket {
  width: min(100%, 340px);
  background: var(--paper);
  color: var(--choco);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
}
.ticket-art { background: var(--berry); height: 130px; }
.ticket-art svg { width: 100%; height: 100%; display: block; }
.art-num { font-family: var(--font-display); font-size: 62px; fill: var(--choco); }
.perf { position: relative; height: 0; margin: 0 18px; border-top: 2px dashed rgba(43, 21, 13, .25); }
.perf::before, .perf::after {
  content: ""; position: absolute; top: -13px;
  width: 24px; height: 24px; border-radius: 50%; background: var(--choco);
}
.perf::before { left: -30px; }
.perf::after { right: -30px; }
.ticket-body { padding: 18px 22px 18px; display: grid; gap: 12px; }
.shop { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--berry-ink); }
.item { margin: -6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.2; }
.ticket dl { margin: 0; display: grid; gap: 6px; font-size: 14px; }
.ticket dl div { display: flex; justify-content: space-between; gap: 12px; }
.ticket dt { color: rgba(43, 21, 13, .62); }
.ticket dd { margin: 0; font-weight: 500; text-align: right; }
.barcode { width: 100%; height: 50px; display: block; fill: var(--choco); }
.code { margin: -6px 0 0; text-align: center; font-size: 13px; letter-spacing: .2em; font-variant-numeric: tabular-nums; }

.claim {
  appearance: none; border: 0; cursor: pointer;
  width: min(100%, 340px);
  margin-top: 6px;
  padding: 15px 24px;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--choco);
  background: var(--berry);
  box-shadow: 0 6px 0 #b8245a;
  transition: transform .1s, box-shadow .1s, background-color .15s;
}
.claim:hover { background: var(--berry-2); }
.claim:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8245a; }
.claim:disabled { cursor: progress; }
.fine { margin: 0; font-size: 12px; color: rgba(255, 246, 230, .6); }

.ticket.rattle { animation: rattle .09s linear infinite; }
@keyframes rattle {
  0%   { transform: translate(0, 0) rotate(0); }
  25%  { transform: translate(-5px, 2px) rotate(-2.5deg); }
  50%  { transform: translate(4px, -2px) rotate(2deg); }
  75%  { transform: translate(-2px, -3px) rotate(-1deg); }
  100% { transform: translate(0, 0) rotate(0); }
}

/* ---------- 빼빼로 무대 ---------- */
.party {
  --aw: min(22vh, 40vw, 180px);
  --ray-a: #ff4f8b; --ray-b: #ff74a4; --glow: rgba(255, 246, 230, .8);
  --coat: #4a2717; --coat-hi: #7d4a30;
  position: fixed; inset: 0; z-index: 10;
  display: grid; grid-template-rows: 1fr auto;
  overflow: hidden;
  background: var(--ray-a);
}
.party[data-type="nude"]   { --ray-a: #ff9f7a; --ray-b: #ffb08f; --glow: rgba(255, 246, 230, .8); }
.party[data-type="crying"] { --ray-a: #7fb2f5; --ray-b: #93c0f8; --glow: rgba(255, 255, 255, .75); --coat: #ff9ec4; --coat-hi: #ffd3e4; }
.party[data-type="sleepy"] { --ray-a: #2a2862; --ray-b: #333177; --glow: rgba(190, 184, 255, .5);  --coat: #f4ecda; --coat-hi: #ffffff; }
.party[data-type="flex"]   { --ray-a: #ffb703; --ray-b: #ffc83a; --glow: rgba(255, 255, 255, .85); }

.rays {
  position: absolute; left: 50%; top: 42%;
  width: 250vmax; height: 250vmax; margin: -125vmax 0 0 -125vmax;
  background: repeating-conic-gradient(var(--ray-a) 0deg 7deg, var(--ray-b) 7deg 14deg);
  animation: spin 24s linear infinite;
}
.party::before {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(circle at 50% 42%, var(--glow) 0, transparent 36%);
}
@keyframes spin { to { transform: rotate(360deg); } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.stage { position: relative; z-index: 3; min-height: 0; }
.actor {
  position: absolute; left: 50%; top: 50%;
  width: var(--aw); height: calc(var(--aw) * 2);
  margin-left: calc(var(--aw) / -2); margin-top: calc(var(--aw) * -1);
  padding: 0; border: 0; background: none; cursor: pointer;
  will-change: transform;
}
.actor:focus-visible { outline: 3px dashed var(--choco); outline-offset: 8px; border-radius: 48px; }
.actor svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* 맛별 부품: data-show에 적힌 종류일 때만 보임 */
.coat { fill: var(--coat); }
.coat-hi { stroke: var(--coat-hi); }
[data-show] { display: none; }
.party[data-type="yalal"]  [data-show~="yalal"],
.party[data-type="nude"]   [data-show~="nude"],
.party[data-type="crying"] [data-show~="crying"],
.party[data-type="sleepy"] [data-show~="sleepy"],
.party[data-type="flex"]   [data-show~="flex"] { display: inline; }

.sweat { animation: drip .6s linear infinite; }
.sweat.s2 { animation-delay: .3s; }
@keyframes drip { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(6px, 26px); opacity: 0; } }
.tear { stroke-dasharray: 14 10; animation: flow .45s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }

.bubble {
  position: absolute; left: 50%; z-index: 4;
  top: max(12px, calc(50% - var(--aw) - 76px));
  max-width: calc(100% - 32px);
  transform: translateX(-50%);
  padding: 10px 18px;
  border: 3px solid var(--choco);
  border-radius: 18px;
  background: var(--paper);
  box-shadow: 4px 4px 0 var(--choco);
  color: var(--choco);
  font-family: var(--font-display);
  font-size: clamp(20px, 5.6vw, 30px);
  text-align: center;
  text-wrap: balance;
  pointer-events: none;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px;
  width: 20px; height: 20px;
  background: var(--paper);
  border-right: 3px solid var(--choco); border-bottom: 3px solid var(--choco);
  transform: translateX(-50%) rotate(45deg);
}
.bubble span { display: inline-block; }
.bubble span.pop { animation: pop .25s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }

.result {
  position: relative; z-index: 5;
  width: min(100% - 32px, 420px);
  margin: 0 auto 16px;
  padding: 18px 20px;
  display: grid; gap: 6px;
  text-align: center;
  border-radius: 22px;
  background: var(--choco);
  color: var(--paper);
  box-shadow: 0 10px 30px rgba(43, 21, 13, .35);
  animation: rise .5s .9s both cubic-bezier(.2, 1.4, .4, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
.result-kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--biscuit); }
.result-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(20px, 5.4vw, 26px); line-height: 1.2; text-wrap: balance; }
.result-fine { margin: 0; font-size: 13px; color: rgba(255, 246, 230, .72); }
.result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
.btn {
  appearance: none; border: 0; cursor: pointer;
  padding: 10px 18px; border-radius: 999px;
  font-family: var(--font-body); font-weight: 700; font-size: 15px;
}
.btn-main { background: var(--berry); color: var(--choco); }
.btn-main:hover { background: var(--berry-2); }
.btn-ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(255, 246, 230, .4); }
.btn-ghost:hover { box-shadow: inset 0 0 0 2px var(--paper); }

@media (prefers-reduced-motion: reduce) {
  .rays, .sweat, .tear, .ticket.rattle, .result, .bubble span.pop { animation: none; }
}
</style>
</head>
<body>

<main id="gift" class="gift">
  <p class="eyebrow">선물 도착 · 11월 11일</p>
  <h1>배정윤이 <em>빼빼로</em>를<br>보냈어요</h1>
  <p class="note">“빼빼로데이라서 준비했어. 꼭 받아줘!”</p>

  <article id="ticket" class="ticket" aria-label="빼빼로 기프티콘">

      <svg viewBox="0 0 340 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

            <rect x="48" y="10" width="8" height="3" rx="1.5" fill="#ffd84d" transform="rotate(-25 52 11)"/>
            <rect x="76" y="5" width="8" height="3" rx="1.5" fill="#6fd3ff" transform="rotate(35 80 6)"/>

          </g>
        </defs>

        <text x="170" y="88" text-anchor="middle" class="art-num">11.11</text>
      </svg>

    <div class="ticket-body">

      <h2 class="item">랜덤 막대과자 1개</h2>
      <dl>
        <div><dt>유효기간</dt><dd>2026.11.11 23:59</dd></div>

        <div><dt>맛</dt><dd>아몬드·누드·딸기·화이트·기본 중 1</dd></div>

  <button id="claim" class="claim" type="button">받기</button>
  <p class="fine">받기를 누르면 바로 사용 처리돼요</p>
</main>

<section id="party" class="party" data-type="yalal" hidden aria-label="빼빼로 수령 결과">
  <div class="rays" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="stage" class="stage">
    <div id="bubble" class="bubble"><span id="bubbleText">…?!</span></div>
    <button id="actor" class="actor" type="button" aria-label="빼빼로 건드리기">
      <svg viewBox="0 0 200 400" aria-hidden="true">
        <!-- 다리, 팔 (몸 뒤) -->
        <g id="legL">
          <path d="M90 328 L84 376" stroke="#d9a35e" stroke-width="9" stroke-linecap="round" fill="none"/>

        </g>
        <g id="legR">
          <path d="M110 328 L116 376" stroke="#d9a35e" stroke-width="9" stroke-linecap="round" fill="none"/>

        </g>

        </g>
        <g id="armR">
          <path d="M126 168 L170 192" stroke="#d9a35e" stroke-width="9" stroke-linecap="round" fill="none"/>

        <!-- 몸통: 아몬드 · 딸기 · 화이트 (보통 굵기) -->
        <g data-show="yalal crying sleepy">

          <g fill="#d9a35e">
            <circle cx="88" cy="290" r="2.2"/><circle cx="110" cy="304" r="2.2"/>

          </g>

                stroke="#2b150d" stroke-width="4" stroke-linejoin="round"/>
          <path class="coat-hi" d="M89 60 Q90 44 96 38" stroke-width="4" stroke-linecap="round" fill="none"/>
        </g>
        <!-- 몸통: 누드 (과자가 겉, 초코가 속) -->

        <g id="eyesGoogly" data-show="yalal">
          <circle cx="85" cy="100" r="17" fill="#fff" stroke="#1a0b06" stroke-width="3"/>

        </g>
        <g data-show="crying">
          <circle cx="85" cy="100" r="18" fill="#fff" stroke="#1a0b06" stroke-width="3"/>
          <circle cx="115" cy="100" r="18" fill="#fff" stroke="#1a0b06" stroke-width="3"/>

    wail(o, s) {
      o.r = -6 + Math.sin(s.T * 4) * 4; o.y = Math.sin(s.T * 20) * 2;
      o.aL = -20 + Math.sin(s.T * 9) * 30; o.aR = 20 - Math.sin(s.T * 9) * 30;
      o.lL = Math.sin(s.T * 12) * 15; o.lR = -o.lL; o.mo = 1.4 + Math.sin(s.T * 30) * .12;
      if (s.every('tear', .05)) s.fromEyes(2, 260);
    },
    slump(o, s) {
      o.sx = 1.05; o.sy = .9; o.y = s.H * .04; o.r = Math.sin(s.T * 1.5) * 5; o.aL = -45; o.aR = 45; o.mo = .7;
      if (s.every('tear', .5)) s.fromEyes(1, 40);
    },
  };

  /* ---------- 상태 ---------- */
  const P = {
    armL: $('armL'), armR: $('armR'), legL: $('legL'), legR: $('legR'),
    pupL: $('pupL'), pupR: $('pupR'), browL: $('browL'), browR: $('browR'),
    eyesGoogly: $('eyesGoogly'), eyesClosed: $('eyesClosed'),
  };
  let type = TYPES.yalal, typeId = 'yalal', pendingId = null, mouthEl = $('m-yalal');
  let raf = 0, running = false, last = 0, T = 0;
  let mode = 'enter', modeStart = 0, modeDur = .7, lastCycle = -1, timers = {}, flags = {};
  let shakeUntil = 0, pupilTimer = 0, rainAcc = 0, wasAwake = false;
  let pos = { x: 0, y: 0, s: 1 };
  let parts = [];

  function say(text) {
    bubbleText.textContent = text;
    bubbleText.classList.remove('pop'); void bubbleText.offsetWidth; bubbleText.classList.add('pop');
  }
  function setBrows([l, r]) { P.browL.setAttribute('d', l); P.browR.setAttribute('d', r); }
  function setAwake(on) {
    wasAwake = on;
    P.eyesGoogly.style.display = on ? 'inline' : '';
    P.eyesClosed.style.display = on ? 'none' : '';
    setBrows(on ? TYPES.yalal.brows : type.brows);
  }

  function applyType(id) {
    typeId = id; type = TYPES[id];
    party.dataset.type = id;
    mouthEl = $('m-' + id);
    setAwake(false);
    P.pupL.setAttribute('cx', 85); P.pupL.setAttribute('cy', 100);
    P.pupR.setAttribute('cx', 115); P.pupR.setAttribute('cy', 100);
    $('resultKicker').textContent = `축하합니다! ${type.flavor} 빼빼로 당첨`;
    $('resultTitle').textContent = `${type.name} 1개 수령 완료`;
    $('resultNo').textContent = type.no;
    result.style.animation = 'none'; void result.offsetWidth; result.style.animation = '';
  }

  function setMode(next) {
    const cfg = type.modes[next];
    mode = next; modeStart = T; lastCycle = -1; timers = {}; flags = {};
    modeDur = rand(...(cfg.dur || [1.1, 1.8]));
    say(pick(cfg.lines));
    SFX[cfg.sfx]();
    if (cfg.burst) burstAtActor(50);
  }
  function nextMode() {
    const cur = type.modes[mode];
    if (cur && cur.next && !(reduce && INTENSE.has(cur.next))) return setMode(cur.next);
    const pool = (type.order || Object.keys(type.modes)).filter((m) => !(reduce && INTENSE.has(m)));
    let n; do { n = pick(pool); } while (n === mode && new Set(pool).size > 1);
    setMode(n);
  }
  function randomId(exclude) { return pick(IDS.filter((i) => i !== exclude)); }

  function begin(id) {
    applyType(id);
    mode = 'enter'; modeStart = T; modeDur = .7; timers = {}; flags = {};
    say(type.enter);
    burst(party.clientWidth / 2, party.clientHeight * .5, 140);
    SFX.pop();
  }

  /* ---------- 파티클 ---------- */
  const SPR = ['#fff6e6', '#2b150d', '#ffd84d', '#6fd3ff', '#f0c27b'];
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = party.clientWidth * dpr; canvas.height = party.clientHeight * dpr;
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn(k, x, y, o = {}) {
    if (parts.length > 380) return;
    const p = { k, x, y, vx: 0, vy: 0, g: 700, vmax: 520, rot: rand(0, 6.28), vr: rand(-6, 6),
                life: 3, size: 1, c: pick(SPR), fade: false, seed: rand(0, 6.28), ...o };
    p.max = p.life;
    parts.push(p);
  }
  function burst(cx, cy, n) {
    if (reduce) n = Math.ceil(n / 4);
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI * .95, -Math.PI * .05), v = rand(250, 750), k = pick(type.burst);
      spawn(k, cx, cy, {
        vx: Math.cos(a) * v, vy: Math.sin(a) * v, vr: rand(-10, 10), life: rand(2.5, 4),
        c: k === 'stick' ? type.coat : k === 'drop' ? '#e8f4ff' : k === 'star' ? pick(['#fff', '#ffe58a']) : pick(SPR),
      });
    }
  }
  function geom() {
    const aw = actor.offsetWidth * pos.s;
    return { aw, cx: party.clientWidth / 2 + pos.x, cy: stage.offsetTop + stage.clientHeight / 2 + pos.y };
  }
  function burstAtActor(n) { const { cx, cy } = geom(); burst(cx, cy, n); }
  function fromHead(n) {
    const { aw, cx, cy } = geom();
    for (let i = 0; i < n; i++) spawn('z', cx + aw * .3, cy - aw * .85, { vx: rand(20, 50), vy: rand(-60, -40), g: 0, vr: 0, rot: 0, life: 2.4, fade: true });
  }
  function fromEyes(n, speed) {
    const { aw, cx, cy } = geom();
    for (let i = 0; i < n; i++) for (const side of [-1, 1]) {
      spawn('drop', cx + side * aw * .1, cy - aw * .45, {
        vx: side * rand(.6, 1.2) * speed, vy: -rand(.3, 1) * speed - 40, g: 900, vmax: 700,
        vr: 0, rot: 0, life: 1.4, c: '#9fd6ff', size: rand(.6, 1),
      });
    }
  }
  function fromBody(n) {
    const { aw, cx, cy } = geom();
    for (let i = 0; i < n; i++) {
      spawn('star', cx + rand(-.8, .8) * aw, cy + rand(-1, 1) * aw, {
        vx: rand(-30, 30), vy: rand(-60, -20), g: 0, life: .8, fade: true, c: '#fffbe0', size: rand(.8, 1.6),
      });
    }
  }
  function rain() {
    const x = rand(0, party.clientWidth), k = type.rain.kind;
    if (k === 'stick') spawn('stick', x, -40, { vx: rand(-30, 30), vy: rand(60, 180), g: 400, vmax: 320, vr: rand(-4, 4), life: 9, c: type.coat });
    else if (k === 'star') spawn('star', x, -20, { vx: rand(-10, 10), vy: rand(20, 50), g: 0, vr: rand(-1, 1), life: 14, c: pick(['#fff', '#ffe58a', '#c9c3ff']), size: rand(.6, 1.2) });
    else if (k === 'coin') spawn('coin', x, -30, { vx: rand(-20, 20), vy: rand(100, 200), g: 500, vmax: 420, vr: rand(4, 10), life: 9 });
    else if (k === 'drop') spawn('drop', x, -20, { vy: rand(380, 520), g: 0, vr: 0, rot: 0, life: 4, c: '#eaf4ff', size: rand(.6, 1) });
    else spawn('spr', x, -20, { vx: rand(-20, 20), vy: rand(80, 160), g: 400, vmax: 300, life: 9 });
  }
  function star(r) {
    g2.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * .35 : r;
      g2.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g2.closePath(); g2.fill();
  }
  function drawParts(dt) {
    const w = party.clientWidth, h = party.clientHeight;
    g2.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.vy = Math.min(p.vy + p.g * dt, p.vmax);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
      const left = Math.max(0, p.life / p.max);
      g2.save();
      g2.globalAlpha = p.fade ? Math.min(1, left * 1.5) : 1;
      g2.translate(p.x, p.y);
      switch (p.k) {
        case 'spr':
          g2.rotate(p.rot); g2.fillStyle = p.c; g2.fillRect(-5, -1.75, 10, 3.5); break;
        case 'stick':
          g2.rotate(p.rot); g2.lineCap = 'round';
          g2.strokeStyle = '#f0c27b'; g2.lineWidth = 6; g2.beginPath(); g2.moveTo(-20, 0); g2.lineTo(20, 0); g2.stroke();
          g2.strokeStyle = p.c; g2.lineWidth = 8; g2.beginPath(); g2.moveTo(-20, 0); g2.lineTo(8, 0); g2.stroke();
          break;
        case 'star':
          g2.globalAlpha *= .55 + .45 * Math.sin(T * 6 + p.seed); g2.rotate(p.rot); g2.fillStyle = p.c; star(7 * p.size); break;
        case 'z':
          g2.fillStyle = '#e9e5ff';
          g2.font = `${Math.round(18 + 16 * (1 - left))}px "Bagel Fat One", sans-serif`;
          g2.fillText('Z', 0, 0); break;
        case 'coin':
          g2.scale(Math.abs(Math.cos(p.rot)) + .12, 1);
          g2.fillStyle = '#ffd34d'; g2.strokeStyle = '#a8740c'; g2.lineWidth = 2;
          g2.beginPath(); g2.arc(0, 0, 9, 0, 6.283); g2.fill(); g2.stroke();
          g2.beginPath(); g2.arc(0, 0, 5, 0, 6.283); g2.stroke(); break;
        case 'drop': {
          const s = 5 * p.size;
          g2.fillStyle = p.c; g2.beginPath(); g2.arc(0, 0, s, 0, Math.PI); g2.lineTo(0, -2.2 * s); g2.closePath(); g2.fill(); break;
        }
      }
      g2.restore();
    }
    parts = parts.filter((p) => p.life > 0 && p.y < h + 60);
  }

  /* ---------- 매 프레임 ---------- */
  function frame(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; T += dt;
    const lt = T - modeStart, W = stage.clientWidth, H = stage.clientHeight;
    const o = { x: 0, y: 0, r: 0, sx: 1, sy: 1, face: 1, aL: 0, aR: 0, lL: 0, lR: 0, mo: 1, shake: 0, awake: false };

    if (mode === 'enter') {
      const p = Math.min(1, lt / modeDur), e = 1 - Math.pow(1 - p, 3);
      o.y = (1 - e) * H * .7; o.sx = o.sy = .3 + .7 * e + Math.sin(p * Math.PI) * .25;
      o.aL = 120 * e; o.aR = -120 * e; o.mo = 1.4;
      if (p >= 1) nextMode();
    } else if (mode === 'exit') {
      const p = Math.min(1, lt / modeDur);
      o.y = -p * p * H * .9; o.sx = o.sy = 1 - .6 * p; o.r = 360 * p; o.aL = 130; o.aR = -130;
      if (p >= 1) begin(pendingId);
    } else {
      const s = {
        lt, T, W, H, dur: modeDur, type,
        newCycle: (k) => (k !== lastCycle ? ((lastCycle = k), true) : false),
        every: (key, iv) => { timers[key] = (timers[key] ?? 0) - dt; if (timers[key] <= 0) { timers[key] = iv; return true; } return false; },
        once: (key) => (flags[key] ? false : (flags[key] = true)),
        kick: (d) => { shakeUntil = T + d; },
        fromHead, fromEyes, fromBody,
      };
      M[type.modes[mode].move || mode](o, s);
      if (reduce) { o.x *= .35; o.y *= .35; o.r *= .35; }
      if (lt > modeDur) nextMode();
    }

    pos.x = o.x; pos.y = o.y; pos.s = o.sy;
    actor.style.transform = `translate(${o.x}px, ${o.y}px) rotate(${o.r}deg) scale(${o.sx * o.face}, ${o.sy})`;
    const dx = type.armDx || 0;
    P.armL.setAttribute('transform', `translate(${dx} 0) rotate(${o.aL} 74 168)`);
    P.armR.setAttribute('transform', `translate(${-dx} 0) rotate(${o.aR} 126 168)`);
    P.legL.setAttribute('transform', `rotate(${o.lL} 90 328)`);
    P.legR.setAttribute('transform', `rotate(${o.lR} 110 328)`);
    const mo = Math.min(1.6, o.mo);
    mouthEl.setAttribute('transform', `translate(100 150) scale(${.9 + .1 * mo} ${mo}) translate(-100 -150)`);

    if (typeId === 'sleepy' && o.awake !== wasAwake) setAwake(o.awake);
    const bw = type.browWiggle * Math.sin(T * 20);
    P.browL.setAttribute('transform', `translate(0 ${bw})`);
    P.browR.setAttribute('transform', `translate(0 ${-bw})`);

    pupilTimer -= dt;
    if ((type.jitter || wasAwake) && pupilTimer <= 0) {
      pupilTimer = rand(.07, .2);
      for (const [el, cx] of [[P.pupL, 85], [P.pupR, 115]]) {
        const a = rand(0, Math.PI * 2), d = rand(3, 9);
        el.setAttribute('cx', cx + Math.cos(a) * d);
        el.setAttribute('cy', 100 + Math.sin(a) * d);
      }
    }

    const amp = reduce ? .35 : 1;
    bubble.style.transform = `translate(calc(-50% + ${o.x * .6}px), ${Math.sin(T * 25) * 2 * amp}px) rotate(${Math.sin(T * 9) * 4 * amp}deg)`;
    const shake = reduce ? 0 : Math.max(o.shake, T < shakeUntil ? 10 : 0);
    stage.style.transform = shake ? `translate(${rand(-shake, shake)}px, ${rand(-shake, shake)}px)` : '';

    rainAcc += dt * type.rain.rate * (reduce ? .3 : 1);
    while (rainAcc >= 1) { rainAcc -= 1; rain(); }
    drawParts(dt);

    raf = requestAnimationFrame(frame);
  }

  /* ---------- 버튼 ---------- */
  function start() {
    gift.hidden = true;
    party.hidden = false;
    ticket.classList.remove('rattle');
    resize();
    parts = []; T = 0; rainAcc = 0; shakeUntil = 0; pos = { x: 0, y: 0, s: 1 };
    begin(randomId(null));
    running = true; last = performance.now();
    raf = requestAnimationFrame(frame);
    actor.focus({ preventScroll: true });
  }

  claim.addEventListener('click', () => {
    audio();
    claim.disabled = true;
    claim.textContent = '받는 중…';
    if (!reduce) ticket.classList.add('rattle');
    SFX.rattle();
    setTimeout(start, reduce ? 150 : 750);
  });

  actor.addEventListener('click', () => {
    if (!running || mode === 'enter' || mode === 'exit') return;
    if (type.tap && !(reduce && INTENSE.has(type.tap))) setMode(type.tap); else nextMode();
    burstAtActor(40);
  });

  $('again').addEventListener('click', () => {
    if (!running || mode === 'exit') return;
    pendingId = randomId(typeId);
    mode = 'exit'; modeStart = T; modeDur = .35;
    say('안녕~!');
    SFX.zip();
  });

  $('mute').addEventListener('click', (e) => {
    muted = !muted;
    e.currentTarget.textContent = muted ? '소리 켜기' : '소리 끄기';
  });

  window.addEventListener('resize', () => { if (running) resize(); });
})();
</script>
</body>
</html>
